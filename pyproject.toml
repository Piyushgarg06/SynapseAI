[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-pkg"
version = "2.0.0a2"
description = "Knowledge graph extraction library powered by LLMs"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Piyush Garg" }
]

dependencies = [
    "GitPython>=3.1.40",
    "ollama>=0.5.0"
]

[project.scripts]
synapse = "synapse.cli:main"